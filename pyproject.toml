[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-scout"
version = "0.1.0"
description = "Adaptive environmental decision-support: next-best observation for early warning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "pandas>=2.2.0",
  "httpx>=0.27.0",
  "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
